<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Serverless Employee Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, sans-serif;

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a,
        #0f766e
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
}

.container{

    width:1100px;

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border-radius:20px;

    padding:40px;

    border:
    1px solid rgba(255,255,255,0.2);

    box-shadow:
    0 20px 50px rgba(0,0,0,0.3);
}

h1{

    color:white;

    text-align:center;

    margin-bottom:30px;

    font-size:40px;
}

.form{

    display:grid;

    grid-template-columns:
    1fr 1fr 1fr auto;

    gap:15px;

    margin-bottom:20px;
}

input{

    padding:15px;

    border:none;

    border-radius:10px;

    background:
    rgba(255,255,255,0.15);

    color:white;

    outline:none;

    font-size:16px;
}

input::placeholder{

    color:#ddd;
}

button{

    padding:15px 20px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;

    transition:0.3s;
}

.add-btn{

    background:
    linear-gradient(
        45deg,
        #06b6d4,
        #3b82f6
    );

    color:white;
}

.view-btn{

    margin-top:15px;

    background:
    linear-gradient(
        45deg,
        #22c55e,
        #16a34a
    );

    color:white;
}

button:hover{

    transform:translateY(-2px);

    opacity:0.9;
}

#message{

    margin-top:15px;

    margin-bottom:20px;

    color:#4ade80;

    font-weight:bold;

    font-size:18px;
}

.table-container{

    overflow-x:auto;
}

table{

    width:100%;

    border-collapse:collapse;

    margin-top:20px;
}

thead{

    background:
    rgba(255,255,255,0.15);
}

th{

    padding:16px;

    color:white;

    text-align:left;

    font-size:17px;
}

td{

    padding:15px;

    color:white;

    border-bottom:
    1px solid rgba(255,255,255,0.08);
}

tbody tr:hover{

    background:
    rgba(255,255,255,0.05);
}

</style>

</head>

<body>

<div class="container">

<h1>🚀 Employee Management Portal</h1>

<div class="form">

<input
type="text"
id="name"
placeholder="Employee Name">

<input
type="email"
id="email"
placeholder="Employee Email">

<input
type="text"
id="department"
placeholder="Department">

<button
class="add-btn"
onclick="registerEmployee()">

Add Employee

</button>

</div>

<button
class="view-btn"
onclick="loadEmployees()">

View Employees

</button>

<div id="message"></div>

<div class="table-container">

<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Department</th>

</tr>

</thead>

<tbody id="employeeBody">

</tbody>

</table>

</div>

</div>

<script>

const API_URL =
"https://nk1yq87932.execute-api.ap-south-1.amazonaws.com/prod";

async function registerEmployee(){

    const data = {

        name:
        document.getElementById("name").value,

        email:
        document.getElementById("email").value,

        department:
        document.getElementById("department").value
    };

    try{

        const response =
        await fetch(
            `${API_URL}/register`,
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(data)
            }
        );

        const result =
        await response.json();

        document.getElementById(
            "message"
        ).innerHTML =
        "✅ Employee Added Successfully";

        loadEmployees();

    }catch(error){

        document.getElementById(
            "message"
        ).innerHTML =
        "❌ Error adding employee";
    }
}

async function loadEmployees(){

    try{

        const response =
        await fetch(
            `${API_URL}/employees`
        );

        const data =
        await response.json();

        const body =
        document.getElementById(
            "employeeBody"
        );

        body.innerHTML = "";

        data.forEach(emp => {

            body.innerHTML += `

            <tr>

            <td>${emp.id}</td>

            <td>${emp.name}</td>

            <td>${emp.email}</td>

            <td>${emp.department}</td>

            </tr>

            `;
        });

    }catch(error){

        document.getElementById(
            "message"
        ).innerHTML =
        "❌ Error loading employees";
    }
}

</script>

</body>
